version: '3.8'

services:
  db:
    image: mariadb:latest
    container_name: briquiuto_db
    # On active local-infile directement au démarrage du serveur
    command: --local-infile=1
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sae_lego
      MYSQL_USER: lego_user
      MYSQL_PASSWORD: legopassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: